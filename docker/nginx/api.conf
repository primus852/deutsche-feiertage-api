server {
    listen 80;
    server_name _;

    limit_req_status 429;

    location = /auth {
        limit_req zone=auth_zone burst=50 nodelay;
        root /srv/app;
        try_files $uri /index.php$is_args$args;
    }

    location ^~ /api/ {
        limit_req zone=api_zone burst=100 nodelay;
        root /srv/app;
        try_files $uri /index.php$is_args$args;
    }

    location ^~ /public/ {
        limit_req zone=public_zone burst=100 nodelay;
        root /srv/app;
        try_files $uri /index.php$is_args$args;
    }

    location / {
        root /srv/app;
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/app/public/index.php;
    }

    location ^~ /media {
        deny all;
    }
}